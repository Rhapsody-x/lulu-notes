[package]
name = "lulu-notes"
version = "2.1.0"
description = "噜噜便签桌面版"
authors = ["Lulu Notes"]
edition = "2021"

[lib]
name = "lulu_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Controls_Dialogs",
] }
